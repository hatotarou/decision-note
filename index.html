<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>決断スキルノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style id="css">
/* 方針：放送の流れ（診断→弱いスキル→鍛える）どおりに進む作業ノート。紙のノート風の落ち着いた配色 */
:root{
  --paper:#f6f5f1; --card:#ffffff; --ink:#1f2a33; --muted:#5d6872; --line:#d9dbd6;
  --accent:#3b4f8a; --accent-soft:#e6eaf5; --gold:#a26a12; --gold-soft:#f6ecd8;
  --good:#2f6b3b; --good-soft:#e2efe3; --warn:#9a3b25; --warn-soft:#f6e3dd;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15171d; --card:#1e2129; --ink:#e7e9ee; --muted:#a3a9b6; --line:#343a48;
    --accent:#a9b8ec; --accent-soft:#252c44; --gold:#e3b25e; --gold-soft:#3a2f1c;
    --good:#8fcb98; --good-soft:#1f3324; --warn:#f0a08c; --warn-soft:#3d2620;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;padding-bottom:12px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.savebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.dirty{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.status.saved{background:var(--good-soft);color:var(--good);border-color:var(--good)}
nav.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
nav.steps a{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35}
nav.steps a b{display:block;font-family:var(--display);font-size:14px}
nav.steps a small{color:var(--muted);font-size:11px}
nav.steps a[aria-current="page"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){nav.steps{grid-template-columns:repeat(3,1fr)}}
section.view h2{font-family:var(--display);font-size:20px;margin:8px 0 4px}
.quote{border-left:3px solid var(--gold);background:var(--gold-soft);padding:8px 12px;margin:0 0 16px;font-size:13.5px;border-radius:0 6px 6px 0}
.quote b{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{min-height:60px;resize:vertical}
button{font:inherit;font-size:13.5px;cursor:pointer;border-radius:6px;border:1px solid var(--accent);background:var(--card);color:var(--accent);padding:6px 12px}
button.primary{background:var(--accent);color:var(--card)}
button.ghost{border-color:var(--line);color:var(--muted)}
button.danger{border-color:var(--warn);color:var(--warn)}
button.on{background:var(--accent);color:var(--card)}
button.on-good{background:var(--good);border-color:var(--good);color:var(--card)}
button.on-wild{background:var(--gold);border-color:var(--gold);color:var(--card)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ex{border-color:var(--gold);color:var(--gold)}
.tag.rev{border-color:var(--accent);color:var(--accent)}
.tag.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.tag.wild{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.warn{color:var(--warn);font-size:12.5px}
.note{color:var(--muted);font-size:12.5px}
.big{font-family:var(--display);font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-child{border-top:0}
.q h3{font-size:14.5px;margin:0 0 4px;line-height:1.5}
.scale{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.scale button{min-width:44px;padding:6px 10px}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
details p{margin:4px 0 0;font-size:13.5px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.w i{background:var(--warn)}
.bar.t{position:relative;overflow:visible}
.bar.t u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.bar.t i{border-radius:4px}
.drill{border-top:1px dashed var(--line);padding:8px 0}
.drill:first-of-type{border-top:0}
.idea{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding:6px 0}
.idea span.t{flex:1;min-width:160px}
.sym{display:flex;gap:4px}
.sym button{padding:2px 9px;min-width:34px}
.empty{color:var(--muted);font-size:13.5px;padding:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:640px;width:100%;max-height:85vh;overflow:auto}
footer{margin-top:28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script id="appjs">
(function(){
"use strict";
var KEY="decision-note-draft-v1", CKEY="decision-note-content-v1", SKEY="decision-note-state-v1";
var VIEWS=[
 {id:"test",n:"1",t:"診断する",s:"18問・採点"},
 {id:"skills",n:"2",t:"結果を見る",s:"六つのスキル"},
 {id:"ideas",n:"3",t:"選択肢を出す",s:"スキル2"},
 {id:"eval",n:"4",t:"比べる",s:"スキル3・4"},
 {id:"meaning",n:"5",t:"意味を確かめる",s:"スキル5"},
 {id:"share",n:"6",t:"伝える",s:"スキル1・6"},
 {id:"train",n:"7",t:"鍛える",s:"8割をめざす"}
];

var ART=!!document.getElementById("state"); /* true：Claudeのノート。false：Webページ版（枠だけ。内容はブラウザに入れる） */
var storageOK=(function(){ try{ localStorage.setItem("dn-test","1"); localStorage.removeItem("dn-test"); return true; }catch(e){ return false; } })();
var C=null, REV=[], Q=[], SCALE={}, SKILLS=[], BANDS=[], EXREV=0, EXAMPLES=[], DR=[], T={};
function applyContent(c){ C=c; REV=c.REV; Q=c.Q; SCALE=c.SCALE; SKILLS=c.SKILLS; BANDS=c.BANDS; EXREV=c.EXREV; EXAMPLES=c.EXAMPLES; DR=c.DR; T=c.T; }
function validContent(c){ return !!(c&&c.Q&&c.Q.length&&c.SKILLS&&c.SKILLS.length&&c.DR&&c.T&&c.REV&&c.BANDS&&c.EXAMPLES); }
(function(){ var c=null, el=document.getElementById("content");
  if(el){ try{c=JSON.parse(el.textContent);}catch(e){} }
  else if(storageOK){ try{c=JSON.parse(localStorage.getItem(CKEY)||"null");}catch(e){} }
  if(validContent(c)) applyContent(c); })();
var armDel="";
var state=load(null);
var dirty=false, lastSaved=state.updatedAt||0, artifactApi=null, view=currentView(), modal=null;

function missingEx(st){ return EXAMPLES.filter(function(e){ return !(st.decisions||[]).some(function(x){return x.id===e.id;}); }); }
function addEx(st){ var m=missingEx(st); if(!st.decisions) st.decisions=[]; m.forEach(function(e){ st.decisions.push(JSON.parse(JSON.stringify(e))); }); if(m.length&&!st.current) st.current=m[0].id; return m; }
function blank(){ return {v:1,updatedAt:0,answers:{},testedAt:"",current:"",decisions:[]}; }
function load(given){
  var s=null, el=document.getElementById("state");
  if(given) s=given;
  else if(el){ try{s=JSON.parse(el.textContent);}catch(e){} }
  else if(storageOK){ try{s=JSON.parse(localStorage.getItem(SKEY)||"null");}catch(e){} }
  if(!s||typeof s!=="object") s=blank();
  if(!s.answers) s.answers={}; if(!s.decisions) s.decisions=[];
  var out=s;
  if(ART&&!given){ try{var d=JSON.parse(localStorage.getItem(KEY)||"null"); if(d&&d.updatedAt>(s.updatedAt||0)){d._draft=true; out=d;}}catch(e){} }
  if(C&&(out.exRev||0)<EXREV){ var m=addEx(out); if(m.length){ out.current=m[0].id; } out.exRev=EXREV; if(ART&&out!==s) out._draft=true; }
  return out;
}
function persistWeb(){ if(!storageOK) return false; try{ var s=JSON.parse(JSON.stringify(state)); delete s._draft; localStorage.setItem(SKEY,JSON.stringify(s)); return true; }catch(e){ return false; } }
function currentView(){var h=(location.hash||"").replace("#",""); return VIEWS.some(function(v){return v.id===h;})?h:"test";}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cur(){ for(var i=0;i<state.decisions.length;i++) if(state.decisions[i].id===state.current) return state.decisions[i]; return state.decisions[0]||null; }
function touch(rerender){ state.updatedAt=Date.now();
  if(ART){ dirty=true; try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
  else { dirty=!persistWeb(); if(!dirty) lastSaved=state.updatedAt; }
  if(rerender) render(); else renderStatus(); }
function val(n){ var a=Number(state.answers[n])||0; if(!a) return 0; return REV.indexOf(n)>=0 ? 6-a : a; }
function answered(){ var c=0; for(var i=1;i<=18;i++) if(Number(state.answers[i])) c++; return c; }
function total(){ var t=0; for(var i=1;i<=18;i++) t+=val(i); return t; }
function skillScore(s){ var t=0; s.qs.forEach(function(q){t+=val(q);}); return t; }

/* ---------- 保存 ---------- */
function buildDoc(){
  var s=JSON.parse(JSON.stringify(state)); delete s._draft;
  var json=JSON.stringify(s).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>決断スキルノート</title>\n"+
   "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n"+
   "<link href=\"https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap\" rel=\"stylesheet\">\n"+
   "<style id=\"css\">"+document.getElementById("css").textContent+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script type=\"application/json\" id=\"content\">"+document.getElementById("content").textContent+"<\/script>\n<script type=\"application/json\" id=\"state\">"+json+"<\/script>\n<script id=\"appjs\">"+document.getElementById("appjs").textContent+"<\/script>\n</body>\n</html>\n";
}
function save(){
  if(!ART){ dirty=!persistWeb(); if(!dirty) lastSaved=state.updatedAt||Date.now(); renderStatus(); return; }
  if(!artifactApi){ openModal("保存できません","このページを開いている場所では保存機能が使えません。書いた内容はこのブラウザに下書きとして残っています。消えないように「Notion用にコピー」で写しを取ってください。"); return; }
  var st=document.getElementById("status"); if(st) st.textContent="保存中…";
  try{ localStorage.removeItem(KEY); }catch(e){}
  artifactApi.publish(buildDoc()).then(function(){}, function(err){
    try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
    var code=(err&&(err.code||err.message))||"";
    var msg=(/not_granted|not_writer/.test(code))?"このページを編集する権限がないため保存できません。内容はこのブラウザに下書きとして残っています。":
            (/conflict/.test(code))?"別の画面で先に保存されたため、この変更は保存されませんでした。ページが新しい版に切り替わります。":
            "保存に失敗しました（"+code+"）。内容はこのブラウザに下書きとして残っています。時間をおいてもう一度「保存する」を押してください。";
    openModal("保存できませんでした",msg); renderStatus();
  });
}

/* ---------- 書き出し ---------- */
function toMarkdown(){
  var L=[]; L.push("# 決断スキルノート（"+new Date().toLocaleDateString("ja-JP")+"）","");
  if(answered()){
    L.push("## 診断"+(state.testedAt?"（"+state.testedAt+"）":""),"","- 合計："+total()+"点（18〜90点。回答 "+answered()+"/18問）");
    SKILLS.forEach(function(s){ L.push("- "+s.k+". "+s.name+"："+skillScore(s)+" / "+s.max+"点"); });
    L.push("");
  }
  var TT=tr(); var dn=DR.filter(function(d){return TT.counts[d.id];}); if(dn.length||TT.history.length){ L.push("## トレーニング（目標 "+(TT.target||80)+"%）",""); dn.forEach(function(d){ L.push("- "+d.t+"："+TT.counts[d.id]+"回（最後 "+(TT.last[d.id]||"")+"）"); }); TT.history.forEach(function(x){ L.push("- 再診断 "+x.date+"：合計"+x.total+"点（"+x.scores.join("・")+"）"); }); L.push(""); }
  state.decisions.forEach(function(d){
    L.push("## 決めたいこと："+d.title+(d.example?"（放送の例）":""),"");
    L.push("### 選択肢（"+d.ideas.length+"個）");
    d.ideas.forEach(function(i){ L.push("- "+i.text+(i.pick==="good"?"【うまくいきそう】":i.pick==="wild"?"【これはないでしょ】":"")); });
    var ev=evalTargets(d); if(ev.length){ L.push("","### 比べる（リスク／結果予測／実現可能性）");
      ev.forEach(function(i){ var e=d.evals[i.id]||{}; L.push("- "+i.text+"："+(e.risk||"—")+" / "+(e.result||"—")+" / "+(e.feas||"—")+(e.worst?"　一番やばいリスク："+e.worst:"")+(e.memo?"　メモ："+e.memo:"")); }); }
    var m=d.meaning||{}; if(m.q1||m.q2||m.q3){ L.push("","### 意味を確かめる","- 自分にとっての意味："+(m.q1||""),"- 誰を幸せにできるか："+(m.q2||""),"- 適当に扱ったら誰が悲しむか："+(m.q3||"")); }
    var sh=d.share||{}; if(sh.basis||sh.story){ L.push("","### 伝える","- 根拠："+(sh.basis||""),"- 実現可能性："+(sh.feas||""),"- 具体的な計画："+(sh.plan||""),"- どれぐらい成功すると思うか："+(sh.success||""),"- ストーリー："+(sh.story||"")); }
    L.push("");
  });
  return L.join("\n");
}
function packText(){ var s=JSON.parse(JSON.stringify(state)); delete s._draft; return JSON.stringify({kind:"decision-note-pack",v:1,exportedAt:new Date().toISOString(),content:C,state:s}); }
function importPack(txt,keepLocal){
  if(!txt) return "枠が空です。貼り付けができていないようです。枠の中をクリックしてから、Ctrl+V（Macは⌘+V）を押してください。";
  var p; try{ p=JSON.parse(txt); }catch(e){ return "貼り付けたものが、ノートのデータではないようです（"+txt.length+"文字。先頭は「"+txt.slice(0,24)+"」）。コピーがうまくいっていない可能性があります。下の「データのファイルから読み込む」を使うか、Claudeのノートで「Miro用データをコピー」を押し直してください。"; }
  if(!p||p.kind!=="decision-note-pack"||!validContent(p.content)) return "これは決断スキルノートのデータではないようです。";
  applyContent(p.content);
  if(storageOK){ try{ localStorage.setItem(CKEY,JSON.stringify(p.content)); }catch(e){ storageOK=false; } }
  var local=null; if(keepLocal&&storageOK){ try{ local=JSON.parse(localStorage.getItem(SKEY)||"null"); }catch(e){} }
  state=load(local||(p.state&&typeof p.state==="object"?p.state:blank())); delete state._draft;
  dirty=!persistWeb(); lastSaved=dirty?0:(local&&state.updatedAt?state.updatedAt:Date.now()); view=currentView(); modal=null;
  return "";
}
/* 鍵つきのURLで開いたとき：暗号化したデータ(d.bin)を取りにいき、このブラウザの中で元に戻す */
function getKey(){ var m=/[?&#]k=([A-Za-z0-9_-]{20,})/.exec(location.search+location.hash); return m?m[1]:""; }
function b64u(x){ x=x.replace(/-/g,"+").replace(/_/g,"/"); while(x.length%4) x+="="; var bin=atob(x), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
function fetchPack(k){
  return fetch("d.bin",{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("データを取得できません "+r.status); return r.arrayBuffer(); })
   .then(function(buf){ var u=new Uint8Array(buf); return crypto.subtle.importKey("raw",b64u(k),{name:"AES-GCM"},false,["decrypt"]).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12)); }); })
   .then(function(pt){ return new TextDecoder().decode(pt); });
}
var bootMsg="";
function boot(){
  if(ART) return; var k=getKey(); if(!k) return;
  if(!window.fetch||!window.crypto||!crypto.subtle){ if(!C){ bootMsg="このブラウザでは自動の読み込みが使えません。下の方法で読み込めます。"; render(); } return; }
  if(!C){ bootMsg="データを読み込んでいます…"; render(); }
  fetchPack(k).then(function(txt){
    if(!C){ var err=importPack(txt,true); bootMsg=err?("自動の読み込みに失敗しました。"+err):""; render(); return; }
    try{ var p=JSON.parse(txt); if(p&&validContent(p.content)&&JSON.stringify(p.content)!==JSON.stringify(C)){ applyContent(p.content); if(storageOK){ try{ localStorage.setItem(CKEY,JSON.stringify(p.content)); }catch(e){} } render(); } }catch(e){}
  },function(e){ if(!C){ bootMsg="自動の読み込みに失敗しました（鍵が違うか、通信できていません）。下の方法で読み込めます。"; render(); } });
}
function legacyCopy(txt){ try{ var ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="0"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); var ok=document.execCommand("copy"); document.body.removeChild(ta); return !!ok; }catch(e){ return false; } }
function copyText(txt,btn){
  var done=function(){ if(btn){var o=btn.textContent; btn.textContent="コピーしました"; setTimeout(function(){btn.textContent=o;},1600);} };
  var fb=function(){ legacyCopy(txt); showCopy(txt); };
  try{ navigator.clipboard.writeText(txt).then(done,fb); }catch(e){ fb(); }
}
function showCopy(txt){ openModal("コピーしてください","<p class=\"note\">自動でコピーできなかった可能性があります。下の枠の中をクリックして、Ctrl+A（全部選択）→ Ctrl+C（コピー）を押してください。Macは⌘+A → ⌘+C です。</p><textarea id=\"copybox\" readonly style=\"min-height:240px\">"+esc(txt)+"</textarea>",true); var ta=document.getElementById("copybox"); if(ta){ try{ ta.focus(); ta.select(); }catch(e){} } }
function openModal(t,b,raw){ modal={title:t,body:raw?b:esc(b)}; render(); }

/* ---------- 画面 ---------- */
function renderStatus(){
  var st=document.getElementById("status"); if(!st) return;
  var when=function(t){ return new Date(t).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
  if(!ART){
    if(!storageOK||dirty){ st.className="status dirty"; st.textContent="保存できていません（バックアップをコピーしてください）"; }
    else { st.className="status"+(lastSaved?" saved":""); st.textContent=lastSaved?("このブラウザに保存済み "+when(lastSaved)):"入力すると自動で保存します"; }
    return;
  }
  if(dirty||state._draft){ st.className="status dirty"; st.textContent="未保存の変更あり"; }

    DR.filter(function(d){return d.k===k.k;}).forEach(function(d){
      var c=T.counts[d.id]||0;
      h+='<div class="drill"><div class="row" style="justify-content:space-between"><b style="font-size:14px">'+esc(d.t)+'</b><span class="tag'+(d.src==="ノート側"?' ex':'')+'">'+esc(d.src)+'</span></div><p style="margin:2px 0 6px;font-size:13.5px">'+esc(d.st)+'</p><div class="row"><span class="note">目安 '+esc(d.min)+'（ノート側の目安）</span><button data-act="done" data-id="'+d.id+'">やった</button>'+(c?'<button class="ghost" data-act="undone" data-id="'+d.id+'" style="padding:2px 8px">取り消す</button><span class="note">'+c+'回 ／ 最後 '+esc(T.last[d.id]||"")+'</span>':'<span class="note">まだ0回</span>')+'<a href="#'+d.go+'">このノートでやる →</a></div></div>';
    });
    h+='</div></div>';
  });
  h+='<div class="card"><b>再診断の記録</b><p class="note" style="margin:4px 0 8px">鍛えたら「1. 診断する」で18問をもう一度答えて、ここで記録します。いつの回答かが残ります。</p><div class="row"><button class="primary" data-act="snap"'+(n<18?' disabled':'')+'>今の回答を記録する</button>'+(n<18?'<span class="note">18問すべて答えると記録できます</span>':'')+'</div>';
  if(hist.length){ h+='<div class="tablewrap"><table><tr><th>日付</th><th>合計</th>'+SKILLS.map(function(k){return '<th>'+k.k+'</th>';}).join('')+'<th></th></tr>';
    hist.forEach(function(x,i){ h+='<tr><td>'+esc(x.date)+'</td><td class="num"><b>'+x.total+'</b></td>'+x.scores.map(function(v,j){ var okk=v>=Math.ceil(SKILLS[j].max*pct/100-1e-9); return '<td class="num">'+v+'/'+SKILLS[j].max+(okk?' ✓':'')+'</td>'; }).join('')+'<td><button class="ghost" data-act="delsnap" data-i="'+i+'" style="padding:1px 8px;font-size:12px">削除</button></td></tr>'; });
    h+='</table></div><p class="note">✓は、今の目標%に届いている印です。</p>'; }
  h+='</div>';
  return h;
}

/* ---------- 操作 ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b) return;
  var act=b.getAttribute("data-act"), d=C?cur():null;
  if(act!=="deldec") armDel="";
  if(act==="save") save();
  else if(act==="export") copyText(toMarkdown(),b);
  else if(act==="pack") copyText(packText(),b);
  else if(act==="openimport") openModal("データを読み込む",'<p class="note">「Miro用データをコピー」または「バックアップをコピー」でコピーしたデータを貼り付けます。今このブラウザにあるデータは、貼り付けたデータに置き換わります。</p>'+setupBox(true),true);
  else if(act==="importpack"){ var pin=document.getElementById("packin"), err=importPack(pin?pin.value.trim():""); if(err){ var im=document.getElementById("importmsg"); if(im){ im.hidden=false; im.textContent=err; } } else render(); }
  else if(act==="closemodal"){ modal=null; render(); }
  else if(act==="ans"){ state.answers[b.getAttribute("data-q")]=Number(b.getAttribute("data-v")); touch(true); }
  else if(act==="resettest"){ state.answers={}; touch(true); }
  else if(act==="pick"&&d){
    var id=b.getAttribute("data-id"), v=b.getAttribute("data-v"), it=d.ideas.filter(function(x){return x.id===id;})[0]; if(!it) return;
    if(it.pick===v){ it.pick=""; touch(true); return; }
    var lim=v==="good"?3:2, cnt=d.ideas.filter(function(x){return x.pick===v;}).length;
    if(cnt>=lim){ var m=document.getElementById("pickmsg"); if(m){ m.hidden=false; m.textContent=(v==="good"?"「うまくいきそう」は3つまで":"「これはないでしょ」は2つまで")+"です。先にどれかを外してください。"; } return; }
    it.pick=v; touch(true);
  }
  else if(act==="delidea"&&d){ var id2=b.getAttribute("data-id"); d.ideas=d.ideas.filter(function(x){return x.id!==id2;}); delete d.evals[id2]; touch(true); }
  else if(act==="sym"&&d){ var e2=d.evals[b.getAttribute("data-id")]||(d.evals[b.getAttribute("data-id")]={}); var k=b.getAttribute("data-k"), v2=b.getAttribute("data-v"); e2[k]=(e2[k]===v2?"":v2); touch(true); }
  else if(act==="done"){ var T=tr(), id3=b.getAttribute("data-id"); T.counts[id3]=(T.counts[id3]||0)+1; T.last[id3]=new Date().toLocaleDateString("ja-JP"); touch(true); }
  else if(act==="undone"){ var T2=tr(), id4=b.getAttribute("data-id"); T2.counts[id4]=Math.max(0,(T2.counts[id4]||0)-1); touch(true); }
  else if(act==="snap"){ if(answered()<18) return; var T3=tr(); T3.history.push({date:new Date().toLocaleDateString("ja-JP"),total:total(),scores:SKILLS.map(skillScore)}); touch(true); }
  else if(act==="delsnap"){ var T4=tr(); T4.history.splice(Number(b.getAttribute("data-i")),1); touch(true); }
  else if(act==="restoreex"){ var mm=addEx(state); if(mm.length) state.current=mm[0].id; touch(true); }
  else if(act==="deldec"&&d){ if(armDel!==d.id){ armDel=d.id; render(); return; } armDel=""; state.decisions=state.decisions.filter(function(x){return x.id!==d.id;}); state.current=state.decisions[0]?state.decisions[0].id:""; touch(true); }
});
document.addEventListener("input",function(e){
  if(!C) return;
  var t=e.target, d=cur();
  if(t.hasAttribute("data-t")){ tr()[t.getAttribute("data-t")]=t.value; touch(false); return; }
  if(t.hasAttribute("data-g")){ state[t.getAttribute("data-g")]=t.value; touch(t.tagName==="SELECT"); return; }
  if(!d) return;
  if(t.hasAttribute("data-e")){ var id=t.getAttribute("data-id"); (d.evals[id]||(d.evals[id]={}))[t.getAttribute("data-e")]=t.value; touch(false); }
  else if(t.hasAttribute("data-m")){ d.meaning[t.getAttribute("data-m")]=t.value; touch(false); }
  else if(t.hasAttribute("data-c")){ d.meaning.checks=d.meaning.checks||{}; d.meaning.checks[t.getAttribute("data-c")]=t.checked; touch(false); }
  else if(t.hasAttribute("data-s")){ d.share[t.getAttribute("data-s")]=t.value; touch(false); }
});
document.addEventListener("submit",function(e){
  e.preventDefault(); if(!C) return; var f=e.target;
  if(f.id==="newd"){ var v=document.getElementById("dnew").value.trim(); if(!v) return; var id=uid(); state.decisions.push({id:id,example:false,title:v,ideas:[],evals:{},meaning:{q1:"",q2:"",q3:"",checks:{}},share:{}}); state.current=id; touch(true); }
  else if(f.id==="newidea"){ var d=cur(), x=document.getElementById("itext").value.trim(); if(!d||!x) return; d.ideas.push({id:uid(),text:x,pick:""}); touch(true); var n=document.getElementById("itext"); if(n) n.focus(); }
});
window.addEventListener("hashchange",function(){ view=currentView(); render(); window.scrollTo(0,0); });
window.addEventListener("pagehide",function(){ if(!ART&&C) persistWeb(); });
document.addEventListener("change",function(e){
  var t=e.target; if(!t||t.id!=="packfile"||!t.files||!t.files[0]) return;
  var r=new FileReader();
  r.onload=function(){ var err=importPack(String(r.result||"").replace(/^﻿/,"").trim()); if(err){ var im=document.getElementById("importmsg"); if(im){ im.hidden=false; im.textContent=err; } } else render(); };
  r.onerror=function(){ var im=document.getElementById("importmsg"); if(im){ im.hidden=false; im.textContent="ファイルを読めませんでした。"; } };
  r.readAsText(t.files[0]);
});

render();
boot();
if(window.claude&&typeof window.claude.use==="function"){ window.claude.use("artifact").then(function(api){ artifactApi=api; },function(){}); }
})();
</script>
</body>
